<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator | Vishal Rathaur</title>
<style>

    @import url('https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    :root {
      --bg-mesh: radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                 radial-gradient(at 85% 20%, rgba(244, 114, 182, 0.15) 0px, transparent 50%),
                 linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #0f172a 100%);
      --glass: rgba(255, 255, 255, 0.10);
      --border: rgba(255, 255, 255, 0.20);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #38bdf8;
      --pink: #f472b6;
      --violet: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg-mesh);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .glass-shell {
      width: 100%;
      max-width: 380px;
      padding: 24px 22px;
      border-radius: 28px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
      margin: auto;
    }
    .brand-hdr {
      text-align: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand-hdr h1 {
      font-family: 'Berkshire Swash', cursive;
      font-weight: 400;
      font-size: 1.65rem;
    }
    .brand-hdr p {
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--cyan);
      margin-top: 2px;
    }

.screen { padding: 14px 16px; border-radius: 18px; background: rgba(0,0,0,0.25); border: 1px solid var(--border); text-align: right; margin-bottom: 14px; }
.expr { font-size: 0.82rem; color: var(--muted); min-height: 18px; }
.val { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 700; word-break: break-all; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button { height: 52px; border-radius: 16px; border: 1px solid var(--border); background: var(--glass); color: #fff; font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 600; cursor: pointer; transition: transform 0.1s ease; }
button:active { transform: scale(0.92); }
.op { background: rgba(56,189,248,0.22); color: var(--cyan); }
.eq { background: linear-gradient(135deg, var(--pink), var(--violet)); border:none; }
</style>
</head>
<body>
  <div class="glass-shell">
    <div class="brand-hdr">
      <h1>Vishal Rathaur</h1>
      <p>Techie Doctor • iOS Glass Calculator</p>
    </div>
    <div class="screen"><div class="expr" id="ex"></div><div class="val" id="vl">0</div></div>
    <div class="grid">
      <button class="op" onclick="act('AC')">AC</button>
      <button class="op" onclick="act('SIGN')">±</button>
      <button class="op" onclick="act('%')">%</button>
      <button class="op" onclick="act('/')">÷</button>
      <button onclick="num('7')">7</button><button onclick="num('8')">8</button><button onclick="num('9')">9</button><button class="op" onclick="act('*')">×</button>
      <button onclick="num('4')">4</button><button onclick="num('5')">5</button><button onclick="num('6')">6</button><button class="op" onclick="act('-')">−</button>
      <button onclick="num('1')">1</button><button onclick="num('2')">2</button><button onclick="num('3')">3</button><button class="op" onclick="act('+')">+</button>
      <button style="grid-column:span 2" onclick="num('0')">0</button><button onclick="num('.')">.</button><button class="eq" onclick="act('=')">=</button>
    </div>
  </div>
<script>
let cur='0', prv='', op=null;
function up(){ document.getElementById('vl').textContent=cur; document.getElementById('ex').textContent=op?(prv+' '+op):''; }
function num(d){ if(d==='.'&&cur.includes('.'))return; cur=(cur==='0'&&d!=='.')?d:cur+d; up(); }
function act(a){
  if(a==='AC'){cur='0';prv='';op=null;}
  else if(a==='SIGN') cur=String(parseFloat(cur||'0')*-1);
  else if(a==='%') cur=String(parseFloat(cur||'0')/100);
  else if(['+','-','*','/'].includes(a)){ if(op&&prv!=='')act('='); prv=cur; op=a; cur='0'; }
  else if(a==='='){
    if(!op||prv==='')return;
    const x=parseFloat(prv), y=parseFloat(cur);
    let r=0;
    if(op==='+')r=x+y; if(op==='-')r=x-y; if(op==='*')r=x*y; if(op==='/')r=y===0?'Error':+(x/y).toFixed(8);
    cur=String(r); prv=''; op=null;
  }
  up();
}
</script>
</body>
</html>
