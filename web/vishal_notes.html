<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Notes | Vishal Rathaur</title>
<style>

    @import url('https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    :root {
      --bg-mesh: radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                 radial-gradient(at 85% 20%, rgba(244, 114, 182, 0.15) 0px, transparent 50%),
                 linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #0f172a 100%);
      --glass: rgba(255, 255, 255, 0.10);
      --border: rgba(255, 255, 255, 0.20);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #38bdf8;
      --pink: #f472b6;
      --violet: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg-mesh);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .glass-shell {
      width: 100%;
      max-width: 380px;
      padding: 24px 22px;
      border-radius: 28px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
      margin: auto;
    }
    .brand-hdr {
      text-align: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand-hdr h1 {
      font-family: 'Berkshire Swash', cursive;
      font-weight: 400;
      font-size: 1.65rem;
    }
    .brand-hdr p {
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--cyan);
      margin-top: 2px;
    }

textarea { width: 100%; min-height: 110px; padding: 14px; border-radius: 16px; border: 1px solid var(--border); background: rgba(0,0,0,0.22); color: #fff; font-family: inherit; font-size: 0.92rem; outline: none; margin-bottom: 10px; resize:vertical; }
.btn { width: 100%; padding: 12px; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; font-family:'Outfit',sans-serif; font-size:1rem; font-weight: 700; cursor: pointer; margin-bottom: 16px; transition: transform 0.1s ease; }
.btn:active { transform:scale(0.95); }
.lst { max-height: 250px; overflow-y: auto; padding-right: 4px; }
.item { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; font-size: 0.88rem; }
.del { background: transparent; border: 1px solid var(--border); color: #fff; width: 26px; height: 26px; border-radius: 8px; cursor: pointer; flex-shrink:0; }
</style>
</head>
<body>
  <div class="glass-shell">
    <div class="brand-hdr">
      <h1>Vishal Rathaur</h1>
      <p>Techie Doctor • Simple iOS Glass Notes</p>
    </div>
    <textarea id="inp" placeholder="Write a note..."></textarea>
    <button class="btn" onclick="add()">+ Save Note</button>
    <div class="lst" id="lst"></div>
  </div>
<script>
let notes = JSON.parse(localStorage.getItem('vr_standalone_notes') || '[{"id":1,"text":"Welcome to Vishal Rathaur Notes!"}]');
function render(){
  localStorage.setItem('vr_standalone_notes', JSON.stringify(notes));
  document.getElementById('lst').innerHTML = notes.map(n =>
    '<div class="item"><span style="line-height:1.4;">'+n.text.replace(/</g,'&lt;')+'</span><button class="del" onclick="del('+n.id+')">×</button></div>'
  ).join('');
}
function add(){
  const v = document.getElementById('inp').value.trim();
  if(!v) return;
  notes.unshift({id:Date.now(), text:v});
  document.getElementById('inp').value='';
  render();
}
function del(id){ notes = notes.filter(n=>n.id!==id); render(); }
render();
</script>
</body>
</html>
